[project]
name = "py-attio"
version = "0.5.1"
description = "A lightweight Python wrapper for the Attio API."
authors = [{ name = "Benjamin Hawn", email = "ben@benjaminhawn.com" }]
readme = "README.md"
requires-python = ">=3.8"
# requests>=2.32.4 required: fixes CVE-2024-35195 (cert verification bypass)
# and CVE-2024-47081 (.netrc credential leak)
dependencies = ["requests>=2.32.4"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "python-dotenv>=1.0.0",
]


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_attio", "py_attio.*"]
exclude = ["assets", "tests"]

[project.scripts]
test = "py_attio.cli:run_pytest"
list_objects = "py_attio.cli:list_objects"
list_lists = "py_attio.cli:list_lists"
list_attributes = "py_attio.cli:list_attributes"
list_members = "py_attio.cli:list_members"
list_notes = "py_attio.cli:list_notes"
create_record = "py_attio.cli:create_record"
crud_records = "py_attio.cli:crud_records"
comprehensive_crud_demo = "py_attio.cli:comprehensive_crud_demo"
custom_objects = "py_attio.cli:custom_objects"
delete_object = "py_attio.cli:delete_object"
associate_people_locations = "py_attio.cli:associate_people_locations"
associate_single_company_people_locations = "py_attio.cli:associate_single_company_people_locations"
update_portfolio_size = "py_attio.cli:update_portfolio_size"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["py_attio"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
